<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba login Drive</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0c; color: #f2f2f5; margin: 0; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 14px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #15151a; color: #f2f2f5; font-size: 14px; margin-bottom: 10px; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: #00ff88; color: #000; font-weight: 700; font-size: 15px; }
  #status { margin: 14px 0; color: #8b8b99; font-size: 14px; line-height: 1.5; }
  li { font-size: 14px; margin: 5px 0; }
</style>
</head>
<body>
<h1>Prueba de conexión con Google Drive</h1>
<input id="clientId" placeholder="ID de cliente (termina en apps.googleusercontent.com)" autocomplete="off">
<button id="connect">Conectar con Google</button>
<div id="status">Pega tu ID y toca Conectar.</div>
<ol id="list"></ol>

<script>
  // Carpeta de música (la misma que usa el reproductor)
  const FOLDER_ID = '0B_fjnoyvEhIhS0NuLTJxM3liYmc';
  const SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
  // Esta dirección tiene que estar autorizada en Google Cloud, igual que esta página
  const REDIRECT = location.origin + location.pathname;

  const $ = id => document.getElementById(id);
  const setStatus = text => { $('status').textContent = text; };

  $('clientId').value = localStorage.getItem('testClientId') || '';

  function connect() {
    const id = $('clientId').value.trim();
    if (!id.endsWith('.apps.googleusercontent.com')) {
      setStatus('El ID no parece válido.');
      return;
    }
    localStorage.setItem('testClientId', id);
    const params = new URLSearchParams({
      client_id: id,
      redirect_uri: REDIRECT,
      response_type: 'token',
      scope: SCOPE,
      include_granted_scopes: 'true'
    });
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
  }

  // Al volver de Google, el token llega en la parte final de la dirección (#access_token=...)
  function readToken() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('error')) {
      history.replaceState(null, '', location.pathname);
      setStatus('Google no autorizó el acceso: ' + h.get('error'));
      return null;
    }
    const token = h.get('access_token');
    if (token) {
      const expires = Date.now() + Number(h.get('expires_in') || 3600) * 1000;
      localStorage.setItem('driveToken', JSON.stringify({ token, expires }));
      history.replaceState(null, '', location.pathname + location.search);
    }
    const saved = JSON.parse(localStorage.getItem('driveToken') || 'null');
    if (saved && saved.expires > Date.now()) return saved.token;
    return null;
  }

  async function listFiles(token) {
    setStatus('Buscando canciones en tu carpeta…');
    const params = new URLSearchParams({
      q: `'${FOLDER_ID}' in parents and trashed = false`,
      fields: 'files(id,name,mimeType)',
      pageSize: '100'
    });
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/files?' + params.toString(), {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (r.status === 401) {
        localStorage.removeItem('driveToken');
        setStatus('El permiso venció. Toca Conectar otra vez.');
        return;
      }
      if (!r.ok) {
        setStatus('Error al leer Drive (código ' + r.status + ').');
        return;
      }
      const data = await r.json();
      const files = data.files || [];
      setStatus('Conectado. Archivos encontrados en la carpeta: ' + files.length);
      $('list').innerHTML = '';
      files.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f.name;
        $('list').appendChild(li);
      });
    } catch (e) {
      setStatus('No se pudo conectar. Revisa tu internet.');
    }
  }

  $('connect').addEventListener('click', connect);

  const token = readToken();
  if (token) listFiles(token);
</script>
</body>
</html>
